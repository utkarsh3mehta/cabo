# Production deployment: the app container (never published directly) behind
# Caddy, which terminates TLS, obtains certificates automatically and proxies
# HTTP and WebSocket traffic. Configure values in .env (see .env.example).
name: cabo

services:
  app:
    build: .
    image: cabo-online:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env, e.g. https://cabo.example.com}
      # Caddy is exactly one proxy hop in front of the app.
      TRUST_PROXY: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RECONNECT_GRACE_MS: ${RECONNECT_GRACE_MS:-60000}
      ROOM_IDLE_TTL_MS: ${ROOM_IDLE_TTL_MS:-900000}
      FINISHED_ROOM_TTL_MS: ${FINISHED_ROOM_TTL_MS:-1800000}
      MAX_ROOMS: ${MAX_ROOMS:-1000}
      BOT_DELAY_MIN_MS: ${BOT_DELAY_MIN_MS:-700}
      BOT_DELAY_MAX_MS: ${BOT_DELAY_MAX_MS:-1500}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-30}
      RATE_LIMIT_CREATE_PER_MIN: ${RATE_LIMIT_CREATE_PER_MIN:-10}
      RATE_LIMIT_JOIN_PER_MIN: ${RATE_LIMIT_JOIN_PER_MIN:-30}
      RATE_LIMIT_LOOKUP_PER_MIN: ${RATE_LIMIT_LOOKUP_PER_MIN:-60}
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. cabo.example.com}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env (Let's Encrypt account and expiry notices)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account state: the only persistent data.
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
